<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Mohawk Valley Somali Bantu Community Association logo — laurel wreath around a community emblem">
  <rect width="64" height="64" rx="14" fill="#1877F2"/>

  <!-- laurel wreath: two symmetric branches (green), opening at top -->
  <g fill="#37a93c">
    <!-- left branch leaves -->
    <ellipse cx="12" cy="46" rx="3" ry="5.2" transform="rotate(-22 12 46)"/>
    <ellipse cx="10.6" cy="38" rx="3" ry="5.2" transform="rotate(-4 10.6 38)"/>
    <ellipse cx="11.5" cy="30" rx="3" ry="5.2" transform="rotate(18 11.5 30)"/>
    <ellipse cx="15" cy="23" rx="3" ry="5.2" transform="rotate(40 15 23)"/>
    <ellipse cx="20.5" cy="17" rx="2.8" ry="4.8" transform="rotate(58 20.5 17)"/>
    <!-- right branch leaves (mirrored) -->
    <ellipse cx="52" cy="46" rx="3" ry="5.2" transform="rotate(22 52 46)"/>
    <ellipse cx="53.4" cy="38" rx="3" ry="5.2" transform="rotate(4 53.4 38)"/>
    <ellipse cx="52.5" cy="30" rx="3" ry="5.2" transform="rotate(-18 52.5 30)"/>
    <ellipse cx="49" cy="23" rx="3" ry="5.2" transform="rotate(-40 49 23)"/>
    <ellipse cx="43.5" cy="17" rx="2.8" ry="4.8" transform="rotate(-58 43.5 17)"/>
  </g>
  <!-- wreath stems -->
  <g fill="none" stroke="#2b8a30" stroke-width="1.6" stroke-linecap="round">
    <path d="M14 50 Q8 36 19 18"/>
    <path d="M50 50 Q56 36 45 18"/>
  </g>

  <!-- top accent: small amber star filling the wreath opening -->
  <path d="M32 7l1.6 3.4 3.7.4-2.8 2.5.8 3.6L32 15.6l-3.1 1.8.8-3.6-2.8-2.5 3.7-.4z" fill="#f0b429"/>

  <!-- center white disc -->
  <circle cx="32" cy="36" r="13" fill="#ffffff"/>

  <!-- community emblem: three figures standing together (org's people) -->
  <g fill="#1877F2">
    <circle cx="26" cy="32.5" r="2.5"/>
    <circle cx="32" cy="31" r="2.9"/>
    <circle cx="38" cy="32.5" r="2.5"/>
    <path d="M21.5 44v-2.4c0-2.5 2-4.4 4.5-4.4s4.5 1.9 4.5 4.4V44z"/>
    <path d="M27 44v-2.8c0-2.8 2.2-5 5-5s5 2.2 5 5V44z"/>
    <path d="M33.5 44v-2.4c0-2.5 2-4.4 4.5-4.4s4.5 1.9 4.5 4.4V44z"/>
  </g>
</svg>
